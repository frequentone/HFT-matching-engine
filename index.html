<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Synapse HFT Viewer</title>
  
  <!-- React and ReactDOM -->
  <script src="https://cdn.jsdelivr.net/npm/react@18/umd/react.production.min.js" crossorigin></script>
  <script src="https://cdn.jsdelivr.net/npm/react-dom@18/umd/react-dom.production.min.js" crossorigin></script>
  
  <!-- Babel -->
  <script src="https://cdn.jsdelivr.net/npm/@babel/standalone/babel.min.js"></script>

  <!-- Recharts -->
  <script src="https://cdn.jsdelivr.net/npm/prop-types@15.8.1/prop-types.min.js"></script>
  <script src="https://cdn.jsdelivr.net/npm/recharts@2.12.6/umd/Recharts.min.js" crossorigin></script>

  <style>
    :root {
      --bg-color: #0d1117;
      --panel-bg: #161b22;
      --text-main: #c9d1d9;
      --text-muted: #8b949e;
      --border-color: #30363d;
      --bid-color: #2ea043;
      --bid-bg: rgba(46, 160, 67, 0.15);
      --ask-color: #f85149;
      --ask-bg: rgba(248, 81, 73, 0.15);
      --accent: #58a6ff;
    }

    body {
      margin: 0;
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
      background-color: var(--bg-color);
      color: var(--text-main);
      -webkit-font-smoothing: antialiased;
    }

    * { box-sizing: border-box; }
    ::-webkit-scrollbar { width: 8px; }
    ::-webkit-scrollbar-track { background: var(--bg-color); }
    ::-webkit-scrollbar-thumb { background: var(--border-color); border-radius: 4px; }

    .app-container {
      max-width: 1200px;
      margin: 0 auto;
      padding: 20px;
      display: flex;
      flex-direction: column;
      gap: 20px;
      height: 100vh;
    }

    .header {
      display: flex;
      justify-content: space-between;
      align-items: center;
      border-bottom: 1px solid var(--border-color);
      padding-bottom: 15px;
      flex-shrink: 0;
    }

    .header h1 { margin: 0; font-size: 24px; color: var(--text-main); }
    .latency { font-family: monospace; color: var(--accent); background: rgba(88, 166, 255, 0.1); padding: 6px 12px; border-radius: 4px; font-size: 14px; }

    .main-content { display: flex; gap: 20px; flex: 1; min-height: 0; }
    .left-column { flex: 1; display: flex; flex-direction: column; gap: 20px; }
    .right-column { flex: 1; display: flex; flex-direction: column; gap: 20px; }

    .panel { background-color: var(--panel-bg); border: 1px solid var(--border-color); border-radius: 8px; padding: 15px; display: flex; flex-direction: column; }
    .order-book-panel { flex: 1; overflow: hidden; }
    .chart-panel { flex: 1; min-height: 300px; }
    .trade-tape-panel { flex: 1; overflow: hidden; }
    .form-panel { flex-shrink: 0; }

    .panel h2 { margin: 0 0 15px 0; font-size: 16px; color: var(--text-muted); border-bottom: 1px solid var(--border-color); padding-bottom: 10px; }

    .book-container { display: flex; flex-direction: column; flex: 1; overflow-y: auto; }
    .book-row { display: flex; justify-content: space-between; padding: 4px 8px; font-family: monospace; font-size: 14px; border-radius: 4px; }
    .book-row:hover { background-color: rgba(255,255,255,0.03); }
    .book-row.ask { color: var(--ask-color); }
    .book-row.ask.fill { background: linear-gradient(to left, var(--ask-bg) var(--depth), transparent var(--depth)); }
    .book-row.bid { color: var(--bid-color); }
    .book-row.bid.fill { background: linear-gradient(to left, var(--bid-bg) var(--depth), transparent var(--depth)); }
    .spread { text-align: center; padding: 10px 0; color: var(--text-muted); font-size: 12px; font-weight: bold; letter-spacing: 1px; }

    .trade-tape-container { display: flex; flex-direction: column; overflow-y: auto; flex: 1; gap: 2px; }
    .trade-row { display: flex; justify-content: space-between; padding: 6px 8px; font-family: monospace; font-size: 13px; border-radius: 4px; }
    .trade-row.buy { color: var(--bid-color); }
    .trade-row.sell { color: var(--ask-color); }
    .trade-row .time { color: var(--text-muted); }

    .form-row { display: flex; gap: 10px; }
    .form-input { flex: 1; background: var(--bg-color); border: 1px solid var(--border-color); color: var(--text-main); padding: 8px 12px; border-radius: 4px; outline: none; }
    .form-input:focus { border-color: var(--accent); }
    .form-select { background: var(--bg-color); border: 1px solid var(--border-color); color: var(--text-main); padding: 8px 12px; border-radius: 4px; outline: none; }
    .form-button { padding: 10px 20px; border: none; border-radius: 4px; font-weight: bold; cursor: pointer; background-color: var(--accent); color: #fff; transition: opacity 0.2s; }
    .form-button:hover { opacity: 0.9; }
  </style>
</head>
<body>
  <div id="root"></div>

  <script type="text/babel">
    const { useState, useEffect } = React;
    const { LineChart, Line, XAxis, YAxis, Tooltip, ResponsiveContainer } = Recharts;

    function App() {
      const [bids, setBids] = useState([]);
      const [asks, setAsks] = useState([]);
      const [trades, setTrades] = useState([]);
      const [chartData, setChartData] = useState([]);
      const [latency, setLatency] = useState(0);

      const [price, setPrice] = useState('');
      const [quantity, setQuantity] = useState('');
      const [orderType, setOrderType] = useState('buy');

      useEffect(() => {
        const ws = new WebSocket("ws://127.0.0.1:8000/ws");
        
        ws.onmessage = (event) => {
          const data = JSON.parse(event.data);
          
          if (data.event === "state") {
            setBids(data.book.bids || []);
            setAsks(data.book.asks || []);
            if (data.latency_us) {
              setLatency(data.latency_us);
            }
          } else if (data.event === "trade") {
            const trade = data.trade;
            setTrades(prev => [trade, ...prev].slice(0, 50));
            
            const timeStr = new Date(trade.timestamp * 1000).toLocaleTimeString([], {minute: '2-digit', second: '2-digit'});
            setChartData(prev => [...prev, { time: timeStr, price: trade.price }].slice(-20));
          }
        };
        
        return () => ws.close();
      }, []);

      const submitOrder = async (e) => {
        e.preventDefault();
        if (!price || !quantity) return;
        
        try {
          await fetch("http://127.0.0.1:8000/order", {
            method: "POST",
            headers: { "Content-Type": "application/json" },
            body: JSON.stringify({
              type: orderType,
              price: parseFloat(price),
              quantity: parseFloat(quantity)
            })
          });
          setPrice('');
          setQuantity('');
        } catch (err) {
          console.error("Order failed", err);
        }
      };

      const maxBidQty = Math.max(...bids.map(b => b.quantity), 1);
      const maxAskQty = Math.max(...asks.map(a => a.quantity), 1);

      return (
        <div className="app-container">
          <div className="header">
            <h1>Synapse HFT Viewer</h1>
            <div className="latency">{latency ? latency.toFixed(2) : 0} µs per match</div>
          </div>
          
          <div className="main-content">
            <div className="left-column">
              <div className="panel order-book-panel">
                <h2>Limit Order Book</h2>
                <div className="book-container">
                  {asks.map((ask, i) => (
                    <div key={`ask-${i}`} className="book-row ask fill" style={{ '--depth': `${(ask.quantity / maxAskQty) * 100}%` }}>
                      <span>{ask.price.toFixed(2)}</span>
                      <span>{ask.quantity.toFixed(2)}</span>
                    </div>
                  ))}
                  
                  <div className="spread">
                    SPREAD {asks.length && bids.length ? (asks[asks.length-1].price - bids[0].price).toFixed(2) : "0.00"}
                  </div>
                  
                  {bids.map((bid, i) => (
                    <div key={`bid-${i}`} className="book-row bid fill" style={{ '--depth': `${(bid.quantity / maxBidQty) * 100}%` }}>
                      <span>{bid.price.toFixed(2)}</span>
                      <span>{bid.quantity.toFixed(2)}</span>
                    </div>
                  ))}
                </div>
              </div>
            </div>

            <div className="right-column">
              <div className="panel chart-panel">
                <h2>Price Action</h2>
                <ResponsiveContainer width="100%" height={250}>
                  <LineChart data={chartData}>
                    <XAxis dataKey="time" stroke="#8b949e" fontSize={12} />
                    <YAxis domain={['auto', 'auto']} stroke="#8b949e" fontSize={12} width={40} />
                    <Tooltip contentStyle={{ backgroundColor: '#161b22', border: '1px solid #30363d' }} />
                    <Line type="stepAfter" dataKey="price" stroke="#58a6ff" strokeWidth={2} dot={true} isAnimationActive={false} />
                  </LineChart>
                </ResponsiveContainer>
              </div>

              <div className="panel trade-tape-panel">
                <h2>Trade Tape</h2>
                <div className="trade-tape-container">
                  {trades.map((t, i) => (
                    <div key={i} className={`trade-row ${t.type.toLowerCase().includes('buy') ? 'buy' : 'sell'}`}>
                      <span>{t.price.toFixed(2)}</span>
                      <span>{t.quantity.toFixed(2)}</span>
                      <span className="time">{new Date(t.timestamp * 1000).toLocaleTimeString([], { hour12: false })}</span>
                    </div>
                  ))}
                </div>
              </div>

              <div className="panel form-panel">
                <h2>Order Entry</h2>
                <form onSubmit={submitOrder} className="form-row">
                  <select className="form-select" value={orderType} onChange={e => setOrderType(e.target.value)}>
                    <option value="buy">Buy</option>
                    <option value="sell">Sell</option>
                  </select>
                  <input type="number" step="0.01" className="form-input" placeholder="Price" value={price} onChange={e => setPrice(e.target.value)} required />
                  <input type="number" step="0.01" className="form-input" placeholder="Quantity" value={quantity} onChange={e => setQuantity(e.target.value)} required />
                  <button type="submit" className="form-button">Submit</button>
                </form>
              </div>
            </div>
          </div>
        </div>
      );
    }

    const root = ReactDOM.createRoot(document.getElementById('root'));
    root.render(<App />);
  </script>
</body>
</html>
